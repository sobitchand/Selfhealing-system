<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .btn { padding: .5rem 1rem; border: 0; border-radius: 6px; cursor: pointer; }
    .btn-main { background: #2563eb; color: #fff; }
    .btn-ghost { background: #e5e7eb; }
    #cart-count { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Corner Shop</h1>

  <div class="panel">
    <label for="qty">Quantity</label>
    <input id="qty" name="quantity" type="number" value="1">
    <button id="add-btn" class="btn btn-main" data-testid="add-to-cart">Add to cart</button>
    <button id="clear-btn" class="btn btn-ghost">Clear</button>
  </div>

  <p>Items in cart: <span id="cart-count">0</span></p>
  <a id="checkout-link" href="#checkout">Proceed to checkout</a>

  <script>
    var count = 0;
    document.getElementById('add-btn').addEventListener('click', function () {
      count += parseInt(document.getElementById('qty').value, 10) || 0;
      document.getElementById('cart-count').textContent = count;
    });
    document.getElementById('clear-btn').addEventListener('click', function () {
      count = 0;
      document.getElementById('cart-count').textContent = '0';
    });
  </script>
</body>
</html>
