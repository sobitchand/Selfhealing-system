<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Target Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .navigation-links { margin-top: 20px; }
        .nav-link { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card" id="main-container">
        <h1 id="page-heading" class="title">User Authentication</h1>
        <p id="sub-heading" class="description">Please log in to your dashboard.</p>

        <!-- Login Form -->
        <form id="login-form">
            <div class="form-group" id="username-group">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" class="input-field control-user" placeholder="Enter username">
            </div>

            <div class="form-group" id="password-group">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" class="input-field control-pass" placeholder="Enter password">
            </div>

            <div class="action-buttons">
                <button type="button" id="sum-btn" class="btn btn-primary">Log In</button>
                <button type="button" id="reset-btn" class="btn btn-danger">Clear Form</button>
            </div>
        </form>

        <!-- Additional Interactive Elements -->
        <div class="navigation-links" id="footer-links">
            <a href="#" id="forgot-password-link" class="nav-link text-small">Forgot Password?</a> |
            <a href="#" id="help-link" class="nav-link text-small">Need Help?</a>
        </div>
    </div>

</body>
</html>
